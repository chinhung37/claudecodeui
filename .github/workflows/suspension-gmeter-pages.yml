# 手動執行：把 suspension-gmeter/ 部署到 GitHub Pages（手機需要 HTTPS 才能讀感測器）
# 先到 Settings → Pages → Source 選「GitHub Actions」，再到 Actions 分頁手動執行這個 workflow。
name: Deploy suspension-gmeter to Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: suspension-gmeter
      - id: deployment
        uses: actions/deploy-pages@v4
